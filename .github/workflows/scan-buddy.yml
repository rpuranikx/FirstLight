name: FirstLight Buddy Scanner

# Second profile (profiles/buddy.yml): environmental / water jobs for a friend.
# Hourly is plenty for government and engineering-firm postings. GitHub's
# scheduler is best-effort, so some hours may be skipped.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # commits profiles/buddy/ state back to the repo

concurrency:
  group: firstlight-buddy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          BUDDY_DISCORD_WEBHOOK_URL: ${{ secrets.BUDDY_DISCORD_WEBHOOK_URL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          # Without the webhook a scan would mark jobs seen that nobody was told about
          if [ -z "$BUDDY_DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::BUDDY_DISCORD_WEBHOOK_URL is not set; skipping"
            exit 0
          fi
          python main.py --profile buddy --notify

      - name: Save state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profiles/buddy/.seen_jobs.json profiles/buddy/.board_cache.json
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: update buddy seen jobs [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "::warning::state push failed"
