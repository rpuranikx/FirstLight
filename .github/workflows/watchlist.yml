name: FirstLight watchlist

on:
  schedule:
    - cron: "0 11 * * 1"       # Mondays, 5-6am Chicago
  workflow_dispatch:

concurrency:
  group: firstlight-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get state branch
        run: |
          if git ls-remote --exit-code origin firstlight-state >/dev/null; then
            git fetch origin firstlight-state --depth=1
            git worktree add state FETCH_HEAD
          else
            mkdir -p state && cp -r data/. state/
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild and verify the watchlist
        env:
          FIRSTLIGHT_DATA: state
        run: python -m firstlight watchlist --profile profiles/rishi.yml
      - name: Save
        run: |
          cd state
          git init -q 2>/dev/null || true
          git config user.name "FirstLight"
          git config user.email "firstlight@users.noreply.github.com"
          git checkout -q -B firstlight-state
          git add -A
          git commit -qm "watchlist $(date -u +%F)" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:firstlight-state
