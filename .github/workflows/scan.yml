name: FirstLight Job Scanner

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: write # needed to commit .seen_jobs.json back to the repo

# Never run two scans at once (they'd race on the state files)
concurrency:
  group: firstlight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — write permission granted above
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore contacts cache (kept out of git)
        uses: actions/cache@v4
        with:
          path: .contacts_cache.json
          key: contacts-v2-${{ github.run_id }}
          restore-keys: contacts-v2-

      - name: Run FirstLight scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python main.py --notify

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .seen_jobs.json .board_cache.json
          if git diff --cached --quiet; then
            echo "No state changes — nothing to commit"
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
