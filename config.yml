# Define your job search parameters here.

Roles:
  - Solutions Engineer
  - Sales Engineer
  - Pre-Sales Engineer
  - Solutions Consultant
  - Implementation Consultant
  - Technical Consultant
  - Forward Deployed Engineer
  - Solutions Architect
  - Technical Delivery      # delivery engineer/consultant, deployment strategist
  - Technical Product Manager  # PM lane: technical, associate and AI PM titles only
  - Customer Engineer
  - Implementation Engineer
  - AI Engineer             # also matches Applied AI, LLM / agent engineer
  - Automation Engineer     # also matches test engineer, SDET, test infra (your current skill set)

Filters:
  min_salary: 115000          # drop jobs whose listed max base is below this (unlisted pay is kept)
  max_age_days: 21            # ignore postings older than this
  first_scan_alert_hours: 48  # when a company is scanned for the first time, only alert on jobs this fresh
  max_years_required: 5       # skip postings that ask for more years of experience than this
  relocate_places: [san francisco, new york, nyc, brooklyn]  # on-site/hybrid here still shows, tagged 🧳
  # titles that contain a role word but aren't the job (e.g. "Forward Deployed Creative")
  exclude_role_words: [designer, creative, product manager, researcher, scientist, recruiter, dental,
                       accountant, accounting, receivable, payable, finance, p2p, sap, oracle, marketing,
                       account executive, attorney, paralegal, intern]
  exclude_title_words: [senior, sr, staff, principal, lead, head of, director, vp, vice president, chief, distinguished, iii, iv]

# Auto-discover high-growth startups beyond the hand-picked list below.
Discovery:
  enabled: true
  refresh_days: 1
  max_probes_per_run: 150     # job-board lookups per run for newly discovered companies
  yc:                         # YC directory via github.com/yc-oss/api (free, updated daily)
    enabled: true
    min_team_size: 15
    max_team_size: 1000
    regions: ["United States", "America / Canada", "Remote"]
    exclude_industries: []    # e.g. ["Consumer", "Healthcare"]
  vc:                         # portfolio companies of top VCs, from their public job boards (free)
    enabled: true
    min_team_size: 15
    max_team_size: 1000
    a16z: true
    boards:                   # Getro-powered portfolio boards; add any jobs.<vc>.com that runs on Getro
      - jobs.accel.com
      - jobs.generalcatalyst.com
      - jobs.khoslaventures.com
      - jobs.insightpartners.com
      - jobs.thrivecap.com
      - jobs.greylock.com
      - jobs.amplifypartners.com
      - jobs.boldstart.vc
      - jobs.primary.vc
      - jobs.lererhippeau.com
      - jobs.costanoa.vc
      - jobs.cowboy.vc
      - jobs.foundationcap.com
      - jobs.menlovc.com
      - jobs.redpoint.com
      - jobs.crv.com
      - jobs.matrix.vc
      - jobs.northzone.com
      - jobs.uncorkcapital.com
      - jobs.workbench.vc
  apollo:                     # needs APOLLO_API_KEY; finds non-YC venture-backed companies
    enabled: false
    employee_ranges: ["11,50", "51,200", "201,500", "501,1000"]
    keywords: ["artificial intelligence", "developer tools", "machine learning", "robotics"]
    locations: ["United States"]
    max_pages: 5

# For each new job, rank the 3 best people to message.
Contacts:
  enabled: true
  max_jobs_per_run: 8         # caps Claude + Hunter/Apollo spend per run
  model: claude-sonnet-5-5    # ranking 3 people is a light task; switch to claude-opus-5-5 for deeper research
  effort: low
  web_search: true
  max_searches: 4
  hunter_email_finder: false  # spend Hunter credits to find emails for picks without one

Profile: |
  Software Automation Engineer II at CNH Industrial (Jan 2023-present), Chicago.
  Builds automation and integration layers across messy systems: embedded Android
  displays (ADB/UIAutomator) with RS-232 and CAN peripherals, Artifactory/Polarion
  build-validation pipelines, a watchdog across 15 hardware test benches, and a
  compatibility layer that ran 6,600+ legacy test cases with zero rewrites.
  Presales engineering co-op at Motorola Solutions (2021-2022): built a JS logic
  engine that cut technical scoping from 3 months to 5 minutes.
  Solo-built Interveil (rpuranikx.github.io/Interveil), an open-source policy
  gateway that blocks prompt-injected AI agent tool calls across OpenAI, Anthropic
  and Gemini, with Claude Code and Codex support.
  UIUC B.S. Systems Engineering & CS (2022). Python, TypeScript, LLM APIs, MCP.
  Also built NightShift (rpuranikx.github.io/NightShift) on Databricks.
  Moving into SE / FDE / AI engineering roles at high-growth startups;
  ~4 years of experience, so mid-level rather than senior roles. Open to Chicago
  or remote. Wants equity and ownership; prefers warm, specific outreach.

# How much you'd want each kind of job. Learned from 20 sample jobs (2026-11-23).
# The tier decides the effort: ringer = everything, stretch = outreach first,
# stepping = quick apply, meh = digest only (no ping).
Taste: |
  ringer: presales Solutions Engineer / Solutions Architect / Solutions Consultant /
    Sales Engineer at a venture-backed tech company, any industry (security, payments,
    martech, crypto, data, AI all good). Remote or Chicago, roughly $125k+ base.
    Commission, OTE or a shared team quota is fine.
  stretch: roles he really wants but may be underqualified for: Forward Deployed
    Engineer, applied AI / AI engineer (even RAG-heavy), Associate or Technical PM at
    an AI or dev tools startup, customer engineer needing a specific stack he lacks, and
    ringer roles that ask for more years than he has (e.g. 5+ yrs presales). Also any
    good role that would mean moving to SF or NYC (open to discussing a move).
  stepping: fine but not exciting: implementation / onboarding consultant, deployment
    or integration engineer (robotics, industrial IoT), technical PM in agriculture,
    automotive or embedded hardware (his current industry), field engineer roles.
    Up to ~50% travel is tolerable here.
  meh: account management / TAM, technical support (even tier 2), consulting with
    travel most weeks (Chicago means nothing if he's on the road), base under ~$120k
    with no equity, and stepping-stone roles that would require moving.

# What FirstLight pitches with. For each job it picks the one project this company
# would care about most and drafts a short message to your #1 contact sharing it.
Projects:
  - name: Interveil
    link: https://rpuranikx.github.io/Interveil
    pitch: >-
      Open-source, self-hosted gateway that traces every AI agent model call and tool
      call and blocks risky tool calls with YAML policies before they run. Works as an
      OpenAI/Anthropic-compatible proxy and an MCP proxy; Claude Code and Codex can
      run through it. Solo-built, ~450 tests.
    best_for: >-
      agent platforms, LLM observability and evals, AI security and governance,
      dev tools, MCP and AI infra companies.
  - name: NightShift
    link: https://rpuranikx.github.io/NightShift
    pitch: >-
      Databricks project built from his real hardware test lab work: overnight
      test-bench logs flow through Delta bronze/silver/gold tables into a dashboard,
      an MLflow model classifies each failure, and an agent writes the morning triage
      report so engineers start the day knowing what broke and why. Has a 50s video.
    best_for: >-
      data platforms, data/ML observability, Databricks ecosystem, analytics, MLOps,
      manufacturing/industrial/hardware and robotics companies.

