# FirstLight profile for an environmental / water / civil job search.
# Run with: python main.py --profile buddy [--notify]
# State lives in profiles/buddy/, alerts go to the webhook in BUDDY_DISCORD_WEBHOOK_URL.

Notify:
  webhook_env: BUDDY_DISCORD_WEBHOOK_URL

# Matched anywhere in the job title (lowercase substrings)
Roles:
  - environmental
  - water
  - wastewater
  - stormwater
  - watershed
  - hydrolog
  - hydrogeolog
  - geolog
  - ecolog
  - natural resource
  - conservation
  - restoration
  - wetland
  - sustainab
  - remediation
  - compliance
  - air quality
  - industrial hygien
  - ehs
  - gis analyst
  - gis specialist
  - gis technician
  - field technician
  - civil engineer
  - staff engineer
  - project engineer
  - water resources
  - scientist

Filters:
  min_salary: 0               # keep everything; government pay is often hourly
  max_age_days: 30
  first_scan_alert_hours: 48  # older matches on the first scan go out as one digest
  max_years_required: 0       # 0 = don't filter on years of experience
  exclude_title_words: [senior, sr, principal, lead, leader, director, vp, vice president, chief, intern, internship, co-op]
  search_location: Illinois   # big national boards are searched here (plus once for remote jobs)
  # Illinois (default places list) or remote. Uncomment to stick to Chicagoland only:
  # local_places: [chicago, evanston, skokie, wilmette, glenview, niles, northbrook, des plaines, lombard, naperville, downers grove, oak brook, schaumburg, elgin, joliet, aurora, wheaton, lemont, cook county]

Discovery:
  enabled: false              # only the employers below

Contacts:
  enabled: false              # no Hunter/Apollo/Claude spend for this profile

Profile: ""

# Each employer with the job board it uses. ats/slug formats are in boards_extra.py.
